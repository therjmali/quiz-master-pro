version: 2
updates:
  # Keep the workflow actions current (low risk, grouped into one monthly PR).
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  # npm version bumps are paused: most devDependencies are backend SDKs that the client never
  # runs, and a bump would need a full regression pass. Security alerts still open PRs.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 0

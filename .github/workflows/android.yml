name: Build Android APK

# Offline-first APK: the whole web app is bundled inside the package.
#   push a tag like v1.0.0  -> build, verify, emulator-test, then publish a GitHub Release
#   run manually            -> build, verify, emulator-test; APK is kept as a workflow artifact
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_ID: com.rjmali.quizmaster

jobs:
  apk:
    name: Build, sign and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      apk_name: ${{ steps.sign.outputs.apk_name }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Resolve version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error title=Tag/version mismatch::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Type-check and verify repository files
        run: |
          npm run typecheck
          npm run verify:repo

      - name: Build web bundle (root base path for the APK)
        env:
          VITE_BASE: /
          VITE_ZITE_RUNNER_URL: ${{ vars.ZITE_RUNNER_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$VITE_ZITE_RUNNER_URL" ]; then
            echo "::notice::Backend endpoint baked into the APK: $VITE_ZITE_RUNNER_URL"
          else
            echo "::notice::No ZITE_RUNNER_URL repository variable - the APK runs fully offline; online-only features (AI, sync, e-mail) stay unavailable."
          fi
          npm run build:fast
          npm run verify:dist

      - name: Prepare Android project
        run: bash scripts/android-prepare.sh "${{ steps.meta.outputs.version }}" "${{ github.run_number }}"

      - name: Assemble release APK
        working-directory: android
        run: |
          set +e
          ./gradlew --no-daemon assembleRelease 2>&1 | tee ../gradle.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            MSG=$(grep -E -A6 "error:|What went wrong|Execution failed|cannot find symbol|Manifest merger|Lint found|FAILURE" ../gradle.log | grep -v "^> Task" | head -60 | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${MSG}"
          fi
          exit "$code"

      - name: Align and sign APK
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          IN=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          OUT="RJ-QUIZ-v${{ steps.meta.outputs.version }}.apk"
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            "$BT/apksigner" sign --ks release.keystore --ks-key-alias "${KS_ALIAS:-quizmaster}" \
              --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" --out "$OUT" aligned.apk
            echo "signing=release key" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Debug signing::No ANDROID_KEYSTORE_B64 secret - signed with a throw-away key. This APK installs fine, but later builds cannot update it in place."
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias dbg \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Quiz Master Pro debug"
            "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out "$OUT" aligned.apk
            echo "signing=throw-away debug key" >> "$GITHUB_OUTPUT"
          fi
          rm -f release.keystore debug.keystore
          echo "apk_name=$OUT" >> "$GITHUB_OUTPUT"
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"

      - name: Verify APK (manifest, bundled web app, signature)
        run: bash scripts/verify-apk.sh "$APK_FILE" "${{ steps.meta.outputs.version }}" "${{ github.run_number }}" "$APP_ID" | tee verify-apk.log

      - name: Job summary
        run: |
          {
            echo "### Android APK"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| File | \`$APK_FILE\` |"
            echo "| Size | $(du -h "$APK_FILE" | cut -f1) |"
            echo "| SHA-256 | \`$(sha256sum "$APK_FILE" | cut -d' ' -f1)\` |"
            echo "| versionName | ${{ steps.meta.outputs.version }} |"
            echo "| versionCode | ${{ github.run_number }} |"
            echo "| Signing | ${{ steps.sign.outputs.signing }} |"
            echo ""
            echo '```'
            cat verify-apk.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: ${{ env.APK_FILE }}
          retention-days: 30
          if-no-files-found: error

  smoke:
    name: Emulator smoke test (install, launch, offline cold start)
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: apk

      - name: Locate APK
        run: echo "APK_PATH=$(find apk -name '*.apk' | head -1)" >> "$GITHUB_ENV"

      - name: Install Pillow (screenshot analysis)
        run: python3 -m pip install --quiet pillow

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/emulator-smoke.sh "$APK_PATH" com.rjmali.quizmaster smoke-output

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-smoke-output
          path: smoke-output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish screenshots (manual runs only)
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=smoke-screenshots
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --prerelease \
            --title "Emulator smoke-test screenshots (manual runs)" \
            --notes "Screenshots taken on an Android emulator during the most recent manual build: first launch and offline cold start." \
            --target "$GITHUB_SHA"
          for f in smoke-output/*.png; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber
          done

  release:
    name: Publish GitHub Release
    needs: [apk, smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: apk

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK_NAME: ${{ needs.apk.outputs.apk_name }}
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## R.J QUIZ - Quiz Master Pro ${TAG}

          Offline-first Android app. The whole app is bundled in the APK, so it opens and works with no network.

          **Install:** download \`${APK_NAME}\`, open it on your phone and allow "Install unknown apps" for your browser/file manager when asked.

          | | |
          | --- | --- |
          | Package | \`${APP_ID}\` |
          | Version | ${VERSION} |
          | SHA-256 | \`$(sha256sum "apk/${APK_NAME}" | cut -d' ' -f1)\` |

          This build passed: type-check, repository verification, APK verification and an Android emulator install/launch/offline-start test.
          See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md) for what changed.
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            for old in $(gh release view "$TAG" --json assets -q '.assets[].name' | grep -E '\.apk$' || true); do
              gh release delete-asset "$TAG" "$old" --yes
            done
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" "apk/${APK_NAME}"
          else
            gh release create "$TAG" "apk/${APK_NAME}" --title "R.J QUIZ ${TAG}" --notes-file notes.md --verify-tag
          fi

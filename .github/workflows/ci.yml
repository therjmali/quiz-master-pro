name: Verify

# Gate for every change: type-check, production build, repository/file integrity,
# and a real-Chrome test that the built app works with the network switched off.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Types, build, repository files, offline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests (sync engine, merge, backups, trash, notifications, AI)
        run: npm run test:unit

      - name: Verify repository files (source tree)
        run: npm run verify:repo

      - name: Build production bundle
        run: npm run build:fast

      - name: Verify build output (precache, no remote assets, SPA fallback)
        run: npm run verify:dist

      - name: Offline test in real Chrome
        run: npm run test:offline

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  database:
    name: Cloud schema tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Apply schema twice and run behavioural tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash scripts/test-sql.sh

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
